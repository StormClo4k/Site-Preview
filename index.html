<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Studio · personalize seu site</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Poppins:wght@600&family=Montserrat:wght@600&family=Playfair+Display:wght@600&family=Space+Grotesk:wght@600&family=Raleway:wght@600&family=Plus+Jakarta+Sans:wght@600&family=DM+Sans&family=Manrope&family=Outfit&family=Sora&family=Nunito&family=Quicksand&family=Work+Sans&family=Archivo&family=Rubik&family=Syne&family=Josefin+Sans&family=Oswald&family=Bebas+Neue&family=Lora&family=Merriweather&family=Cormorant+Garamond&family=Libre+Baskerville&family=Cinzel&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f2;--pn:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#e2e2dc;--ac:#4f46e5;--ac2:#eceeff}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--pn:#1e1e1c;--tx:#eeeee8;--mu:#9a9a92;--bd:#34342f;--ac:#8b85ff;--ac2:#25244a}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--pn);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--ac)}button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);background:var(--ac2)}
.top,.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd)}
.top h1{font-size:15px;margin:0 10px 0 0}
.body{flex:1;display:flex;min-height:0}
nav{width:80px;display:flex;flex-direction:column;gap:4px;padding:10px 8px;background:var(--pn);border-right:1px solid var(--bd)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:10px 4px;font-size:11px;color:var(--mu);border-radius:10px}
nav button span{font-size:20px}
nav button[aria-selected=true]{background:var(--ac2);color:var(--ac);font-weight:600}
#panel{width:clamp(340px,27vw,460px);overflow-y:auto;padding:18px;background:var(--pn);border-right:1px solid var(--bd)}
h2{font-size:18px;margin:0 0 2px}.hint{color:var(--mu);margin:0 0 6px;font-size:13px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 8px}
.canvas{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.cbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--pn);font-size:12px;color:var(--mu)}
.cbar select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 6px}
.viewport{flex:1;min-height:0;overflow:auto;padding:14px}
.wrap{margin:0 auto;position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 12px 40px rgba(0,0,0,.16);background:#fff}
.frame.phone{border-radius:36px;border:9px solid #222}.frame iframe{flex:1;height:auto}
.chrome{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
.chrome i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome span{flex:1;margin:0 40px 0 10px;background:var(--bg);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--mu);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nopanel #panel{display:none}
.frame iframe,.stage iframe{width:100%;height:100%;border:0;background:#fff}
#st{position:absolute;left:24px;bottom:20px;font-size:12px;background:var(--pn);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;color:var(--mu)}
.tg,.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{display:flex;flex-direction:column;gap:6px;padding:6px;text-align:left;font-size:12px}
.mini{position:relative;height:50px;border-radius:6px;overflow:hidden;border:1px solid rgba(128,128,128,.3)}
.mini i{position:absolute;left:0;right:0;top:0;height:10px}.mini b{position:absolute;left:8px;top:20px;width:30px;height:4px;border-radius:2px}.mini u{position:absolute;left:8px;top:30px;width:22px;height:9px}
.cc{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;position:relative;font-size:12px}
.cc input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.cc .sw{width:28px;height:28px;border-radius:6px;border:1px solid rgba(128,128,128,.35);flex:none}.cc small{display:block;color:var(--mu)}
.fc{display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1.1;padding:8px 4px}.fc small{font:10px system-ui;color:var(--mu);text-align:center}
.seg{display:flex;gap:6px}.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;padding:7px 4px}
.seg i{width:14px;height:14px;border:2px solid currentColor}.seg.sm button{font-size:11px;padding:6px 2px}
.sw2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding:12px;border:1px solid var(--bd);border-radius:10px}
.sw2 small{display:block;color:var(--mu);font-size:12px}
.sw2 input{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw2 input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw2 input:checked{background:var(--ac)}.sw2 input:checked::after{left:19px}
.f{display:block;margin:10px 0}.f>span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.f input,.f textarea,.inl input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.f input:focus,.f textarea:focus{border-color:var(--ac);outline:0}
.pre{display:flex}.pre em{font-style:normal;padding:9px 8px;border:1px solid var(--bd);border-right:0;border-radius:8px 0 0 8px;color:var(--mu);background:var(--bg)}.pre input{border-radius:0 8px 8px 0}
.drop{display:block;position:relative;height:130px;border:2px dashed var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg)}
.drop img{width:100%;height:100%;object-fit:cover;display:block}
.drop span{position:absolute;inset:auto 0 0;padding:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center}
.drop:hover,.drop.over{border-color:var(--ac)}
.prow{border:1px solid var(--bd);border-radius:10px;margin:8px 0;overflow:hidden}.prow.off{opacity:.55}
.phead{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:0;background:none;text-align:left;padding:8px}
.phead img{width:46px;height:46px;border-radius:6px;object-fit:cover;background:var(--bg);flex:none}
.pn{flex:1;min-width:0}.pn b,.pn small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pn small{color:var(--mu);font-size:12px}
.ed{padding:4px 12px 12px;border-top:1px solid var(--bd)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{margin:14px 0 6px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.oh b{font-size:13px}.oh small{color:var(--mu);font-size:11px;white-space:nowrap}
.orow{display:grid;grid-template-columns:1fr 112px 34px;gap:6px;margin:6px 0;align-items:center}
.orow input{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--pn);color:var(--tx);font:inherit}
.orow input:focus{border-color:var(--ac);outline:0}.orow .pre em{padding:8px 7px;background:var(--pn)}.orow .pre input{border-radius:0 8px 8px 0}
.orow button{padding:0;height:35px}
.srow{display:grid;grid-template-columns:118px 1fr 34px;gap:6px;margin:6px 0;align-items:center}
.srow input{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--pn);color:var(--tx);font:inherit}
.srow input:focus{border-color:var(--ac);outline:0}.srow button{padding:0;height:35px}.srow input[data-sf=label]{font-weight:600}
.acts{display:flex;gap:6px;margin-top:12px}.dng{color:#c0392b;margin-left:auto}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.step{display:flex;align-items:center;gap:8px;font-size:13px}.step button{width:30px;padding:4px}
.bulk{margin-top:14px;font-size:13px}.inl{display:flex;gap:8px;align-items:center;margin-top:8px}.inl input{width:80px}
.lk{margin-top:12px;font-size:12px}.lk code{display:block;word-break:break-all;background:var(--bg);padding:6px 8px;border-radius:6px;margin:4px 0;color:var(--mu)}.lk a{color:var(--ac);font-weight:600}
.warn{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;background:#fff4e5;color:#8a5a00}.warn.ok{background:#e8f6ec;color:#1d6b35}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#222;color:#fff;padding:10px 14px;border-radius:10px;transition:.25s;z-index:30;font-size:13px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{margin-left:10px;background:none;color:#a5b4fc;border:0;padding:0;font-weight:600}
#ov .bar{flex-wrap:nowrap;white-space:nowrap;padding-top:max(10px,env(safe-area-inset-top))}.ovd{display:flex;gap:8px}
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}#ov[hidden]{display:none}
.stage{flex:1;display:flex;justify-content:center;padding:12px;min-height:0}.stage iframe{border:1px solid var(--bd);transition:width .2s}
@media(max-width:860px){.body{flex-direction:column}nav{flex-direction:row;width:auto;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav button{flex:1}#panel{width:auto;height:44%;border-right:0}.dev,.top h1,.ovd,.tx,.cbar label{display:none}.viewport{padding:8px}
.top{gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}.top button{white-space:nowrap;padding:7px 11px}nav button{padding:8px 2px;min-width:62px}
.frame{border-radius:6px}.cbar{padding:6px 10px}}
</style>
</head>
<body>
<header class="top"><h1>Site Studio</h1>
<button id="undo" aria-label="Desfazer" title="Desfazer (Ctrl+Z)">↶</button><button id="redo" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z ou Ctrl+Y)">↷</button><button id="reset" title="Voltar ao site original">Padrão</button>
<span style="flex:1"></span>
<div class="seg dev"><button data-dev="100%" aria-pressed="true">Desktop</button><button data-dev="768px">Tablet</button><button data-dev="390px">Celular</button></div>
<span style="flex:1"></span>
<button id="prev" aria-label="Visualizar o site em tela cheia">👁<span class="tx"> Visualizar</span></button><button class="pri" id="dl" aria-label="Baixar ZIP">⬇ <span class="tx">Baixar </span>ZIP</button></header>
<div class="body"><nav id="nav" role="tablist" aria-label="Seções"></nav><section id="panel"></section>
<main class="canvas"><div class="cbar"><button id="tgl" aria-pressed="false" title="Recolher ou mostrar o painel (Ctrl+B)">◧ Painel</button><span style="flex:1"></span>

<div class="viewport" id="vp"><div class="wrap" id="wrap"><div class="frame" id="frame"><div class="chrome" id="chrome"><i></i><i></i><i></i><span id="url"></span></div><iframe id="pv" title="Pré-visualização do site"></iframe></div></div></div>
<span id="st"></span></main></div>
<div id="ov" hidden><div class="bar"><button class="pri" id="ovX">← Voltar à personalização</button><span style="flex:1"></span>
<span class="ovd"><button data-ow="100%">Desktop</button><button data-ow="768px">Tablet</button><button data-ow="390px">Celular</button></span><button id="ovTab">Nova aba</button></div>
<div class="stage"><iframe id="ovf" title="Modelo"></iframe></div></div>
<div id="toast" role="status"></div>
<script type="application/json" id="site-src">"<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"description\" content=\"Moda jovem e contemporânea. Conheça camisetas, camisas, shorts e calças.\">\n  <title>Sua Marca | Estilo em cada detalhe<\/title>\n\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap\" rel=\"stylesheet\">\n  <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\" rel=\"stylesheet\">\n  <style>\n/* ============ Variáveis ============ */\n:root {\n  --gold: #c9a273;\n  --gold-deep: #7a5a30;\n  --ink: #070b10;\n  --ink-2: #0e0f10;\n  --brown-1: #2c2214;\n  --brown-2: #2f2418;\n  --olive: #261d02;\n  --text: #f1ece4;\n  --muted: #a89a86;\n  --line: rgba(201, 162, 115, .22);\n  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n\nhtml { scroll-behavior: smooth; scroll-padding-top: 90px; }\nbody {\n  font-family: var(--font);\n  background: var(--olive);\n  color: var(--text);\n  -webkit-font-smoothing: antialiased;\n}\na { color: inherit; text-decoration: none; }\nh1, h2 { letter-spacing: -.045em; font-weight: 800; }\nem { font-style: italic; font-weight: 500; color: var(--gold); }\n\n.eyebrow {\n  font-size: .68rem; letter-spacing: .28em; font-weight: 700;\n  color: var(--gold); margin-bottom: 1rem; text-transform: uppercase;\n}\n\n/* ============ Barra de aviso ============ */\n.announcement {\n  background: var(--gold-deep);\n  color: #f6ecdc;\n  font-size: .68rem; font-weight: 700; letter-spacing: .26em;\n  padding: .55rem 1rem;\n}\n\n/* ============ Cabeçalho ============ */\n.site-header {\n  background: var(--ink);\n  position: sticky; top: 0; z-index: 1030;\n  border-bottom: 1px solid rgba(255,255,255,.04);\n}\n.site-header .navbar { padding-top: 1rem; padding-bottom: 1rem; }\n.brand { display: inline-flex; flex-direction: column; line-height: 1; }\n.brand-name { font-size: 2rem; font-weight: 800; letter-spacing: -.06em; color: #fff; position: relative; }\n.crown { color: var(--gold); font-size: .9rem; position: relative; top: -.85rem; margin-left: .1rem; }\n.brand small { font-size: .5rem; letter-spacing: .24em; font-weight: 700; color: #cbbfae; margin-top: .55rem; }\n\n.site-header .nav-link {\n  color: #f4efe8; font-size: .82rem; font-weight: 500; padding: .5rem .9rem;\n}\n.site-header .nav-link:hover { color: var(--gold); }\n\n.menu-toggle { border: 1px solid var(--line); color: #fff; font-size: 1.2rem; padding: .25rem .65rem; }\n.menu-toggle:focus { box-shadow: none; }\n\n.header-cta {\n  display: inline-flex; align-items: center; gap: 1.4rem;\n  border: 1px solid rgba(255,255,255,.35);\n  padding: .85rem 1.1rem; font-size: .72rem; font-weight: 700; color: #fff;\n  transition: .25s;\n}\n.header-cta:hover { background: var(--gold); border-color: var(--gold); color: #1a1208; }\n\n/* ============ Hero ============ */\n.hero {\n  position: relative;\n  min-height: 560px;\n  display: flex; align-items: center;\n  /* Troque a URL abaixo pela sua foto principal (ex.: img/hero.jpg) */\n  background:\n    linear-gradient(90deg, rgba(7,11,16,.86) 0%, rgba(7,11,16,.55) 45%, rgba(7,11,16,.15) 100%),\n    url('https://images.unsplash.com/photo-1613372281199-ec69ace5e926?auto=format&fit=crop&w=1800&q=75') center/cover no-repeat,\n    linear-gradient(135deg, #1b1612 0%, #3a2a1a 55%, #6b4a2b 100%);\n}\n.hero-inner { position: relative; padding-top: 4rem; padding-bottom: 4rem; }\n.hero-copy { max-width: 560px; padding-left: 1rem; }\n.hero h1 { font-size: clamp(2.8rem, 6.5vw, 5.2rem); line-height: .98; margin-bottom: 1.5rem; }\n.hero h1 em { display: inline-block; }\n.hero-text { font-size: .95rem; line-height: 1.75; color: #efe7db; max-width: 340px; margin-bottom: 2rem; }\n\n.btn-gold {\n  display: inline-flex; align-items: center; gap: 2.2rem;\n  background: var(--gold-deep); color: #fff7ea;\n  padding: 1rem 1.3rem; font-size: .7rem; font-weight: 700;\n  letter-spacing: .14em; text-transform: uppercase; transition: .25s;\n}\n.btn-gold:hover { background: var(--gold); color: #1a1208; }\n\n.hero-note {\n  position: absolute; right: 2rem; bottom: 3rem;\n  border-right: 2px solid rgba(255,255,255,.5);\n  padding-right: 1.1rem; text-align: right;\n}\n.hero-note span { display: block; font-size: .55rem; letter-spacing: .22em; color: #e9ddca; font-weight: 700; margin-bottom: .5rem; }\n.hero-note strong { font-size: 1.35rem; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }\n\n/* ============ Categorias ============ */\n.category-strip { background: var(--brown-1); border-bottom: 1px solid var(--line); }\n.category-strip a {\n  display: flex; flex-direction: column; align-items: center; text-align: center;\n  padding: 1.8rem 1rem; height: 100%;\n  border-right: 1px solid rgba(255,255,255,.06);\n  transition: background .25s;\n}\n.category-strip .col-lg-3:last-child a { border-right: 0; }\n.category-strip a:hover { background: rgba(201,162,115,.08); }\n.category-icon { font-size: 1.7rem; line-height: 1; margin-bottom: .6rem; color: #f4efe8; }\n.category-strip b { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .35rem; }\n.category-strip small { font-size: .68rem; color: var(--muted); }\n\n/* ============ Produtos ============ */\n.products-section { background: var(--olive); padding: 5rem 0 6rem; }\n.section-heading {\n  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;\n  gap: 1.5rem; margin-bottom: 3rem;\n}\n.section-heading h2 { font-size: clamp(2rem, 4vw, 3rem); margin: 0; }\nh2 span { color: var(--gold); }\n\n.filter-row { display: flex; flex-wrap: wrap; gap: .5rem; }\n.filter {\n  background: transparent; border: 1px solid var(--line); color: #e9ddca;\n  padding: .55rem 1rem; font-size: .72rem; font-weight: 600; transition: .2s;\n  font-family: inherit;\n}\n.filter:hover { border-color: var(--gold); }\n.filter.active { background: var(--gold); border-color: var(--gold); color: #1a1208; }\n\n.product-card { display: flex; flex-direction: column; height: 100%; }\n.product-img {\n  position: relative; aspect-ratio: 4 / 3.1; background-size: cover; background-position: center;\n  margin-bottom: 1.2rem;\n}\n.badge-tag {\n  position: absolute; top: .9rem; left: .9rem;\n  background: var(--ink); color: #fff; font-size: .55rem; letter-spacing: .14em;\n  font-weight: 700; padding: .4rem .6rem; text-transform: uppercase;\n}\n.product-cat { font-size: .6rem; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: .6rem; }\n.product-name { font-size: 1.05rem; font-weight: 600; margin-bottom: .6rem; letter-spacing: -.01em; }\n.product-price { font-size: .95rem; font-weight: 700; margin-bottom: 1rem; }\n.product-specs { font-size: .72rem; line-height: 1.6; color: var(--gold); margin-bottom: 1.2rem; flex-grow: 1; }\n.product-specs b { color: #f1ece4; font-weight: 700; }\n\n.btn-details {\n  display: flex; justify-content: space-between; align-items: center; width: 100%;\n  background: var(--ink); color: #fff; border: 0; padding: 1rem;\n  font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;\n  font-family: inherit; transition: .25s;\n}\n.btn-details:hover { background: var(--gold-deep); }\n\n/* ============ Sobre ============ */\n.manifesto { background: var(--ink-2); }\n.manifesto-art {\n  position: relative; min-height: 520px; height: 100%;\n  display: flex; flex-direction: column; justify-content: space-between; padding: 3rem 4rem 3rem 5rem;\n  /* Troque pela sua foto (ex.: img/sobre.jpg) */\n  background:\n    linear-gradient(180deg, rgba(7,11,16,.15), rgba(7,11,16,.55)),\n    url('https://images.unspl lass=\"col-lg-6\">\n            <p class=\"eyebrow\">VAMOS CONVERSAR<\/p>\n            <h2>Entre em contato<span>.<\/span><\/h2>\n            <p class=\"contact-intro\">Dúvidas sobre tamanhos, peças ou novidades? Fale com a gente.<\/p>\n          <\/div>\n          <div class=\"col-lg-6\">\n            <div class=\"contact-item\">\n              <span class=\"contact-symbol\">⌖<\/span>\n              <div>\n                <small>ENDEREÇO<\/small>\n                <p id=\"contact-address\">Seu endereço aqui<\/p>\n                <a id=\"contact-map\" href=\"#\" target=\"_blank\" rel=\"noopener\">Consultar no mapa ↗<\/a>\n              <\/div>\n            <\/div>\n            <div class=\"contact-item\">\n              <span class=\"contact-symbol\">↗<\/span>\n              <div>\n                <small>TELEFONE / WHATSAPP<\/small>\n                <p id=\"contact-phone\">(00) 00000-0000<\/p>\n                <a id=\"contact-whatsapp\" href=\"#\" target=\"_blank\" rel=\"noopener\">Abrir conversa no WhatsApp ↗<\/a>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <!-- Rodapé -->\n  <footer class=\"footer\">\n    <div class=\"container-xl footer-inner\">\n      <a class=\"brand\" href=\"#inicio\">\n        <span class=\"brand-name\"><span data-brand=\"name\">Store<\/span><span class=\"crown\">♛<\/span><\/span>\n        <small data-brand=\"tagline\">ESTILO EM CADA DETALHE<\/small>\n      <\/a>\n      <p>ESTILO · CONFORTO · PERSONALIDADE<\/p>\n      <small>© <span id=\"year\"><\/span> <span data-brand=\"name\">Store<\/span>. Todos os direitos reservados. Fotos: <a href=\"https://unsplash.com\" target=\"_blank\" rel=\"noopener\">Unsplash<\/a>.<\/small>\n    <\/div>\n  <\/footer>\n\n  <!-- Modal de detalhes do produto -->\n  <div class=\"modal fade product-modal\" id=\"productModal\" tabindex=\"-1\" aria-hidden=\"true\">\n    <div class=\"modal-dialog modal-dialog-centered modal-lg\">\n      <div class=\"modal-content\">\n        <button type=\"button\" class=\"dialog-close\" data-bs-dismiss=\"modal\" aria-label=\"Fechar detalhes\">×<\/button>\n        <div class=\"row g-0\" id=\"modal-content-area\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Carrinho -->\n  <div class=\"offcanvas offcanvas-end cart-panel\" tabindex=\"-1\" id=\"cartPanel\" aria-labelledby=\"cartTitle\">\n    <div class=\"offcanvas-header\">\n      <h5 class=\"offcanvas-title\" id=\"cartTitle\">Seu carrinho<\/h5>\n      <button type=\"button\" class=\"btn-close btn-close-white\" data-bs-dismiss=\"offcanvas\" aria-label=\"Fechar\"><\/button>\n    <\/div>\n    <div class=\"offcanvas-body\" id=\"cart-items\"><\/div>\n    <div class=\"cart-footer\">\n      <div class=\"cart-total\"><span>Total<\/span><span id=\"cart-total\">R$ 0,00<\/span><\/div>\n      <a id=\"cart-checkout\" class=\"btn-gold w-100\" href=\"#contato\" target=\"_blank\" rel=\"noopener\">Finalizar pelo WhatsApp <span>→<\/span><\/a>\n      <p class=\"cart-note\" id=\"cart-note\"><\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast-msg\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n  <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\"><\/script>\n  <script>\n/* =====================================================\n   CONFIGURAÇÃO — edite aqui os dados da sua loja\n   ===================================================== */\nconst CONFIG = {\n  name: 'Store',                       // nome da marca\n  tagline: 'ESTILO EM CADA DETALHE',   // frase abaixo do logo\n  announcement: 'ESTILO EM CADA DETALHE · NOVA COLEÇÃO',\n  address: 'Seu endereço aqui',        // ex.: 'Rua Exemplo, 123 - São Paulo/SP'\n  phone: '(00) 00000-0000',            // texto exibido\n  whatsappNumber: '5511924835700',                  // só números com DDI+DDD, ex.: '5511999999999'\n  whatsappMessage: 'Olá! Vi o site e gostaria de mais informações.'\n};\n\n/* =====================================================\n   PRODUTOS — adicione, remova ou edite à vontade\n   category deve ser o nome de uma das categorias da faixa (ou vazio)\n   image: caminho da foto (ex.: 'img/produto1.jpg'). Sem foto, aparece um degradê.\n   ===================================================== */\nconst PRODUCTS = [\n  { id: 1, category: 'Camisetas', tag: 'Novo tom',  name: 'Camiseta Boxy Off-white', price: 74.90,\n    fabric: 'Meia-malha de algodão', feel: 'Natural, leve e respirável', composition: '100% algodão',\n    image: 'https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=900&q=75', tone: ['#d8d2c8', '#8a8174'],\n    description: 'Modelagem ampla com caimento solto e gola reforçada. Ideal para o dia a dia.' },\n  { id: 2, category: 'Camisas', tag: 'Leveza', name: 'Camisa Linho Blend', price: 119.90,\n    fabric: 'Mistura de algodão e linho', feel: 'Fresco, natural e com textura discreta', composition: '70% algodão / 30% linho',\n    image: 'https://images.unsplash.com/photo-1745284505024-1ac4453a67b2?auto=format&fit=crop&w=900&q=75', tone: ['#e9b872', '#b87b3a'],\n    description: 'Camisa leve para os dias quentes, do casual ao mais alinhado.' },\n  { id: 3, category: 'Shorts', tag: 'Casual', name: 'Shorts Sarja Relax', price: 84.90,\n    fabric: 'Sarja de algodão com elastano', feel: 'Toque firme com flexibilidade', composition: '98% algodão / 2% elastano',\n    image: 'https://images.unsplash.com/photo-1617953644310-e690da9be982?auto=format&fit=crop&w=900&q=75', tone: ['#9aa0a3', '#4d5356'],\n    description: 'Corte relaxado com cós ajustável e bolsos laterais.' },\n  { id: 4, category: 'Calças', tag: 'Clássico', name: 'Calça Reta Minimal', price: 119.90,\n    fabric: 'Sarja leve', feel: 'Suave, estruturado e confortável', composition: '97% algodão / 3% elastano',\n    image: 'https://images.unsplash.com/photo-1714143136372-ddaf8b606da7?auto=format&fit=crop&w=900&q=75', tone: ['#8fb4d9', '#4f7ba8'],\n    description: 'Calça de corte reto, versátil e confortável para qualquer ocasião.' },\n  { id: 5, category: 'Camisetas', tag: 'Essencial', name: 'Camiseta Básica Preta', price: 59.90,\n    fabric: 'Malha penteada', feel: 'Macio e com ótimo caimento', composition: '100% algodão',\n    image: 'https://images.unsplash.com/photo-1790065647534-681685463320?auto=format&fit=crop&w=900&q=75', tone: ['#2b2b2b', '#111111'],\n    description: 'O básico que combina com tudo. Costura reforçada e gola que não estica.' },\n  { id: 6, category: 'Camisas', tag: 'Social', name: 'Camisa Oxford Azul', price: 129.90,\n    fabric: 'Oxford de algodão', feel: 'Estruturado e durável', composition: '100% algodão',\n    image: 'https://images.unsplash.com/photo-1602810316693-3667c854239a?auto=format&fit=crop&w=900&q=75', tone: ['#9db8d6', '#5f7fa3'],\n    description: 'Clássico atemporal com botões e colarinho firme.' },\n  { id: 7, category: 'Shorts', tag: 'Verão', name: 'Bermuda Cargo', price: 94.90,\n    fabric: 'Sarja leve', feel: 'Resistente e confortável', composition: '100% algodão',\n    image: 'https://images.unsplash.com/photo-1621496503717-095a410e1566?auto=format&fit=crop&w=900&q=75', tone: ['#a6a082', '#6b664d'],\n    description: 'Bolsos funcionais e modelagem reta para o dia a dia urbano.' },\n  { id: 8, category: 'Calças', tag: 'Urbano', name: 'Calça Jogger Preta', price: 129.90,\n    fabric: 'Moletom leve', feel: 'Macio e flexível', composition: '80% algodão / 20% poliéster',\n    image: 'https://images.unsplash.com/photo-1542674685-1005e2db517e?auto=format&fit=crop&w=900&q=75', tone: ['#3a3a3a', '#161616'],\n    description: 'Punhos elásticos e cintura ajustável para conforto o dia todo.' }\n];\n\nconst SIZES = ['P', 'M', 'G', 'GG'];\n\n/* =====================================================\n   UTILITÁRIOS\n   ===================================================== */\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\nconst bg = p => `background-image:url('${p.image}'), linear-gradient(135deg, ${p.tone[0]}, ${p.tone[1]})`;\nconst findProduct = id => PRODUCTS.find(p => p.id === Number(id));\nconst escA = s => String(s).replace(/&/g, '&amp;').replace(/\"/g, '&quot;').replace(/<\/g, '&lt;');\n\n/* Opções de compra de cada produto (botões \"Adicionar\").\n   Se o produto tiver p.options, usa essa lista; senão usa SIZES com o preço do produto.\n   price vazio/null = mesmo preço do produto. */\nfunction optsOf(p) {\n  const own = Array.isArray(p.options) ? p.options.filter(o => o && String(o.label).trim()) : [];\n  const list = own.length ? own : SIZES.map(label => ({ label }));\n  return list.map(o => ({\n    label: String(o.label).trim(),\n    price: (o.price === null || o.price === undefined || o.price === '' || isNaN(Number(o.price))) ? p.price : Number(o.price)\n  }));\n}\nconst unitPrice = (p, label) => { const o = optsOf(p).find(o => o.label === label); return o ? o.price : p.price; };\nfunction priceRange(p) { const v = optsOf(p).map(o => o.price); const min = Math.min(...v); return { min, varies: Math.max(...v) !== min }; }\n/* Detalhes do produto (as linhas \"Ingredientes: ...\").\n   Se o produto tiver p.specs usa essa lista; senão usa os 3 campos padrão. Linhas sem texto ficam ocultas. */\nconst SPEC_LABELS = ['Tecido', 'Toque', 'Composição'];\nfunction specsOf(p) {\n  const list = Array.isArray(p.specs) ? p.specs : [{ label: SPEC_LABELS[0], value: p.fabric }, { label: SPEC_LABELS[1], value: p.feel }, { label: SPEC_LABELS[2], value: p.composition }];\n  return list.filter(r => r && String(r.value == null ? '' : r.value).trim());\n}\nfunction specsHTML(p) {\n  return specsOf(p).map(r => `<div>${String(r.label || '').trim() ? `<b>${escA(String(r.label).trim())}:<\/b> ` : ''}${escA(String(r.value).trim())}<\/div>`).join('');\n}\nfunction priceHTML(p) { const r = priceRange(p); return (r.varies ? '<span class=\"from\">a partir de<\/span> ' : '') + brl(r.min); }\n\nconst store = {\n  get(key, fallback) {\n    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }\n    catch (e) { return fallback; }\n  },\n  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignora */ } }\n};\n\nconst HEART = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"/><\/svg>';\n\nconst NS = String(CONFIG.name).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9]+/g, '') || 'store';\nconst CART_KEY = 'store_cart_' + NS, WISH_KEY = 'store_wish_' + NS;\nlet cart = store.get(CART_KEY, []).filter(c => { const p = findProduct(c.id); return p && optsOf(p).some(o => o.label === c.size); });\nlet wish = new Set(store.get(WISH_KEY, []));\n\n/* Aviso rápido */\nlet toastTimer;\nfunction toast(msg) {\n  const t = $('#toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);\n}\n\n/* =====================================================\n   REVELAR AO ROLAR\n   ===================================================== */\nconst io = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n  });\n}, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n\nfunction observeReveals(root = document) {\n  $$('.reveal:not(.in)', root).forEach(el => io.observe(el));\n}\n\nfunction setupStaticReveals() {\n  ['.section-heading', '.manifesto-art', '.manifesto-copy', '.contact-section .col-lg-6',\n   '.category-strip .col-6', '.values > div'].forEach(sel => {\n    $$(sel).forEach((el, i) => {\n      el.classList.add('reveal');\n      el.style.setProperty('--d', (i * 0.08) + 's');\n    });\n  });\n}\n\n/* =====================================================\n   PRODUTOS\n   ===================================================== */\nconst grid = $('#product-grid');\nconst filters = $$('.filter');\n\nfunction cardHTML(p, i) {\n  const fav = wish.has(p.id);\n  return `\n    <div class=\"col-6 col-md-4 col-lg-3 reveal\" style=\"--d:${(i % 4) * 0.08}s\">\n      <article class=\"product-card\">\n        <div class=\"product-img\">\n          <div class=\"product-img-bg\" style=\"${bg(p)}\" data-open=\"${p.id}\"><\/div>\n          <span class=\"badge-tag\">${escA(p.tag)}<\/span>\n          <button class=\"wish ${fav ? 'on' : ''}\" data-wish=\"${p.id}\" aria-label=\"Favoritar ${escA(p.name)}\" aria-pressed=\"${fav}\">${HEART}<\/button>\n          <div class=\"quick-add\">\n            <span>Adicionar<\/span>\n            ${optsOf(p).map(o => `<button data-quick=\"${p.id}\" data-size=\"${escA(o.label)}\" title=\"${escA(o.label)} · ${brl(o.price)}\" aria-label=\"Adicionar ${escA(o.label)} por ${brl(o.price)}\">${escA(o.label)}<\/button>`).join('')}\n          <\/div>\n        <\/div>\n        <div class=\"product-cat\">${escA(p.category)}<\/div>\n        <h3 class=\"product-name\">${escA(p.name)}<\/h3>\n        <div class=\"product-price\">${priceHTML(p)}<\/div>\n        <div class=\"product-specs\">${specsHTML(p)}<\/div>\n        <button class=\"btn-details\" data-open=\"${p.id}\">Ver detalhes <span>↗<\/span><\/button>\n      <\/article>\n    <\/div>`;\n}\n\nfunction renderProducts(category = 'Todos') {\n  const list = category === 'Todos' ? PRODUCTS : PRODUCTS.filter(p => p.category === category);\n  grid.innerHTML = list.map(cardHTML).join('');\n  observeReveals(grid);\n}\n\nfunction setFilter(category) {\n  filters.forEach(f => f.classList.toggle('active', f.dataset.filter === category));\n  renderProducts(category);\n}\n\nfilters.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));\n$$('.category-strip a[data-filter]').forEach(a => a.addEventListener('click', () => setFilter(a.dataset.filter)));\n\ngrid.addEventListener('click', e => {\n  const wishBtn = e.target.closest('[data-wish]');\n  if (wishBtn) {\n    const id = Number(wishBtn.dataset.wish);\n    const on = !wish.has(id);\n    on ? wish.add(id) : wish.delete(id);\n    store.set(WISH_KEY, [...wish]);\n    wishBtn.classList.toggle('on', on);\n    wishBtn.setAttribute('aria-pressed', on);\n    toast(on ? 'Salvo nos favoritos' : 'Removido dos favoritos');\n    return;\n  }\n  const quick = e.target.closest('[data-quick]');\n  if (quick) { addToCart(Number(quick.dataset.quick), quick.dataset.size); return; }\n  const open = e.target.closest('[data-open]');\n  if (open) openModal(open.dataset.open);\n});\n\n/* =====================================================\n   MODAL DE DETALHES\n   ===================================================== */\nconst modal = new bootstrap.Modal($('#productModal'));\nconst modalArea = $('#modal-content-area');\nlet modalSize = '';\nlet modalProduct = null;\n\nfunction openModal(id) {\n  const p = findProduct(id);\n  if (!p) return;\n  const opts = optsOf(p);\n  modalProduct = p;\n  modalSize = opts[0].label;\n  const showPrice = priceRange(p).varies;\n  modalArea.innerHTML = `\n    <div class=\"col-md-6\"><div class=\"modal-img\" style=\"${bg(p)}\"><\/div><\/div>\n    <div class=\"col-md-6\">\n      <div class=\"modal-body-custom\">\n        <div class=\"product-cat\">${escA(p.category)}<\/div>\n        <h3>${escA(p.name)}<\/h3>\n        <div class=\"product-price\" id=\"modal-price\">${brl(opts[0].price)}<\/div>\n        <p>${escA(p.description)}<\/p>\n        <div class=\"product-specs\">${specsHTML(p)}<\/div>\n        <div class=\"size-label\">TAMANHO<\/div>\n        <div class=\"size-row\">\n          ${opts.map((o, n) => `<button class=\"size ${n === 0 ? 'sel' : ''} ${showPrice ? 'has-price' : ''}\" data-size=\"${escA(o.label)}\">${escA(o.label)}${showPrice ? `<small>${brl(o.price)}<\/small>` : ''}<\/button>`).join('')}\n        <\/div>\n        <button class=\"btn-gold w-100\" data-add=\"${p.id}\">Adicionar ao carrinho <span>→<\/span><\/button>\n      <\/div>\n    <\/div>`;\n  modal.show();\n}\n\nmodalArea.addEventListener('click', e => {\n  const size = e.target.closest('.size');\n  if (size) {\n    $$('.size', modalArea).forEach(x => x.classList.remove('sel'));\n    size.classList.add('sel');\n    modalSize = size.dataset.size;\n    const mp = $('#modal-price');\n    if (mp && modalProduct) mp.textContent = brl(unitPrice(modalProduct, modalSize));\n    return;\n  }\n  const add = e.target.closest('[data-add]');\n  if (add) { addToCart(Number(add.dataset.add), modalSize); modal.hide(); }\n});\n\n/* =====================================================\n   CARRINHO\n   ===================================================== */\nfunction saveCart() { store.set(CART_KEY, cart); renderCart(); }\n\nfunction bumpCount() {\n  const c = $('#cart-count');\n  c.classList.remove('bump');\n  void c.offsetWidth;\n  c.classList.add('bump');\n}\n\nfunction addToCart(id, size) {\n  const found = cart.find(c => c.id === id && c.size === size);\n  found ? found.qty++ : cart.push({ id, size, qty: 1 });\n  saveCart();\n  bumpCount();\n  toast(`${findProduct(id).name} (${size}) adicionado ao carrinho`);\n}\n\nfunction changeQty(id, size, delta) {\n  const i = cart.findIndex(c => c.id === id && c.size === size);\n  if (i < 0) return;\n  cart[i].qty += delta;\n  if (cart[i].qty <= 0) cart.splice(i, 1);\n  saveCart();\n}\n\nfunction renderCart() {\n  const items = cart.map(c => ({ ...c, p: findProduct(c.id) })).filter(i => i.p);\n  const qty = items.reduce((s, i) => s + i.qty, 0);\n  const total = items.reduce((s, i) => s + i.qty * unitPrice(i.p, i.size), 0);\n\n  const count = $('#cart-count');\n  count.textContent = qty;\n  count.classList.toggle('show', qty > 0);\n\n  $('#cart-items').innerHTML = items.length\n    ? items.map(i => `\n        <div class=\"cart-item\">\n          <div class=\"cart-thumb\" style=\"${bg(i.p)}\"><\/div>\n          <div>\n            <b>${escA(i.p.name)}<\/b>\n            <small>Tamanho ${i.size}<\/small>\n            <div class=\"qty\">\n              <button data-qty=\"-1\" data-id=\"${i.id}\" data-size=\"${i.size}\" aria-label=\"Diminuir\">−<\/button>\n              <span>${i.qty}<\/span>\n              <button data-qty=\"1\" data-id=\"${i.id}\" data-size=\"${i.size}\" aria-label=\"Aumentar\">+<\/button>\n            <\/div>\n            <div class=\"price\">${brl(unitPrice(i.p, i.size) * i.qty)}<\/div>\n          <\/div>\n          <button class=\"cart-remove\" data-qty=\"-999\" data-id=\"${i.id}\" data-size=\"${i.size}\" aria-label=\"Remover\">×<\/button>\n        <\/div>`).join('')\n    : '<div class=\"cart-empty\">Seu carrinho está vazio.<br>Escolha uma peça e adicione por aqui.<\/div>';\n\n  $('#cart-total').textContent = brl(total);\n\n  const checkout = $('#cart-checkout');\n  const note = $('#cart-note');\n  checkout.classList.toggle('disabled', !items.length);\n  if (CONFIG.whatsappNumber) {\n    const lines = items.map(i => `• ${i.qty}x ${escA(i.p.name)} (${i.size}) — ${brl(unitPrice(i.p, i.size) * i.qty)}`);\n    const msg = `Olá! Quero finalizar este pedido:\\n\\n${lines.join('\\n')}\\n\\nTotal: ${brl(total)}`;\n    checkout.href = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;\n    note.textContent = '';\n  } else if (CONFIG.whatsappUrl) {\n    checkout.href = CONFIG.whatsappUrl;\n    note.textContent = '';\n  } else {\n    checkout.href = '#contato';\n    note.textContent = 'Para finalizar pelo WhatsApp, preencha o número do WhatsApp em CONFIG, no final do index.html.';\n  }\n}\n\n$('#cartPanel').addEventListener('show.bs.offcanvas', () => $('#toast').classList.remove('show'));\n$('#cart-items').addEventListener('click', e => {\n  const b = e.target.closest('[data-qty]');\n  if (b) changeQty(Number(b.dataset.id), b.dataset.size, Number(b.dataset.qty));\n});\n\n/* =====================================================\n   ROLAGEM: header, progresso, parallax e menu ativo\n   ===================================================== */\nconst header = $('.site-header');\nconst progress = $('#scrollProgress');\nconst hero = $('.hero');\nconst navLinks = $$('.site-header .nav-link');\nconst sectionIds = ['inicio', 'produtos', 'sobre', 'contato'];\nlet ticking = false;\n\nfunction onScroll() {\n  const y = window.scrollY;\n  header.classList.toggle('scrolled', y > 40);\n  const max = document.documentElement.scrollHeight - window.innerHeight;\n  progress.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';\n  if (y < window.innerHeight * 1.2) hero.style.setProperty('--py', (y * 0.25) + 'px');\n\n  let current = sectionIds[0];\n  sectionIds.forEach(id => {\n    const el = document.getElementById(id);\n    if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.35) current = id;\n  });\n  navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));\n  ticking = false;\n}\n\nwindow.addEventListener('scroll', () => {\n  if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }\n}, { passive: true });\n\n/* Menu mobile fecha ao clicar num link */\nconst menu = $('#menuPrincipal');\n$$('#menuPrincipal a').forEach(a => a.addEventListener('click', () => {\n  if (menu.classList.contains('show')) bootstrap.Collapse.getOrCreateInstance(menu).hide();\n}));\n\n/* =====================================================\n   EFEITOS DE MOUSE (somente em telas com mouse)\n   ===================================================== */\nif (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {\n  // Botões \"magnéticos\"\n  $$('.btn-gold, .header-cta, .cart-btn').forEach(el => {\n    el.addEventListener('mousemove', e => {\n      const r = el.getBoundingClientRect();\n      const x = (e.clientX - r.left - r.width / 2) * 0.22;\n      const y = (e.clientY - r.top - r.height / 2) * 0.32;\n      el.style function lum(h) { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16);

}

  if (d.tab) { cur = d.tab; render(); el('#panel').scrollTop = 0; jump(JUMP[cur]); return; }
  if (d.dev) { dev = d.dev; document.querySelectorAll('.dev button').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); return; }
  if (d.preset !== undefined) { applyPreset(+d.preset); return; }
  if (d.th !== undefined) { const th = THEMES[d.th]; TK.forEach(k => S[k] = th[k]); render(); changed(); return; }
  if (d.font) { S.font = d.font; render(); changed(); return; }
  if (d.rad !== undefined) { S.radius = d.rad; render(); changed(); return; }
  if (d.open !== undefined) { openIdx = openIdx === +d.open ? -1 : +d.open; render(); if (openIdx >= 0) jump('#produtos'); return; }
  if (d.setcat !== undefined) { P[+d.i].catId = d.setcat; render(); changed(); return; }
  if (d.lim) { S.limit = Math.min(P.length, Math.max(1, S.limit + +d.lim)); render(); changed(); return; }
  if (d.add !== undefined || d.dup !== undefined) {
    const at = d.dup !== undefined ? +d.dup : P.length - 1, full = S.limit === P.length;
    const id = Math.max(0, ...P.map(p => p.id)) + 1, base = P[at] || P[0] || {};
    P.splice(at + 1, 0, { ...JSON.parse(JSON.stringify(base)), id, name: d.dup !== undefined ? base.name + ' (cópia)' : 'Novo produto', tag: d.dup !== undefined ? base.tag : 'Novo' });
    if (full) S.limit = P.length; openIdx = at + 1; render(); changed(); toast('Produto adicionado'); return;
  }
  if (d.del !== undefined) {
    if (P.length <= 1) { toast('Mantenha pelo menos 1 produto.'); return; }
    const snap = JSON.stringify(S); P.splice(+d.del, 1); S.limit = Math.min(S.limit, P.length) || 1; openIdx = -1; render(); changed(); toast('Produto removido', 'Desfazer', () => load(snap)); return;
  }
  if (d.mv) { const [i, k] = d.mv.split(':').map(Number), j = i + k; if (j < 0 || j >= P.length) return; [P[i], P[j]] = [P[j], P[i]]; openIdx = j; render(); changed(); return; }
  if (d.copen !== undefined) { openCat = openCat === d.copen ? '' : d.copen; render(); return; }
  if (d.cadd !== undefined) {
    const id = 'c' + (Math.max(0, ...S.categories.map(c => +c.id.slice(1))) + 1);
    S.categories.push({ id, name: 'Nova categoria', icon: '◆', sub: 'Descreva esta categoria', strip: true }); openCat = id; render(); changed(); toast('Categoria criada. Adicione produtos nela.'); return;
  }
  if (d.cdel !== undefined) {
    const snap = JSON.stringify(S), n = nProd(d.cdel); S.categories = S.categories.filter(c => c.id !== d.cdel); P.forEach(p => { if (p.catId === d.cdel) p.catId = ''; });
    openCat = ''; render(); changed(); toast('Categoria removida' + (n ? ': ' + n + ' produto(s) ficaram sem categoria' : ''), 'Desfazer', () => load(snap)); return;
  }
  if (d.cmv) { const [i, k] = d.cmv.split(':').map(Number), j = i + k, C = S.categories; if (j < 0 || j >= C.length) return; [C[i], C[j]] = [C[j], C[i]]; render(); changed(); return; }
  if (d.addin !== undefined) {
    const id = Math.max(0, ...P.map(p => p.id)) + 1, base = P[0] || {};
    P.splice(S.limit, 0, { ...JSON.parse(JSON.stringify(base)), id, name: 'Novo produto', tag: 'Novo', catId: d.addin }); S.limit++;
    cur = 'items'; openIdx = S.limit - 1; render(); el('#panel').scrollTop = 0; changed(); toast('Produto criado. Edite nome, preço e foto.'); return;
  }
  if (d.sadd !== undefined) {
    const o = ownSpecs(P[+d.sadd]); o.push({ label: '', value: '' }); render(); changed();
    const n = el('[data-si="' + d.sadd + '"][data-sj="' + (o.length - 1) + '"][data-sf="label"]'); if (n) n.focus(); return;
  }
  if (d.sdel !== undefined) {
    const [i, j] = d.sdel.split(':').map(Number), snap = JSON.stringify(S); ownSpecs(P[i]).splice(j, 1); render(); changed(); toast('Detalhe removido', 'Desfazer', () => load(snap)); return;
  }
  if (d.sreset !== undefined) {
    const snap = JSON.stringify(S); delete P[+d.sreset].specs; render(); changed(); toast('Detalhes padrão da loja restaurados', 'Desfazer', () => load(snap)); return;
  }
  if (d.oadd !== undefined) {
    const o = ownOpts(P[+d.oadd]); o.push({ label: '', price: '' }); render(); changed();
    const n = el('[data-oi="' + d.oadd + '"][data-oj="' + (o.length - 1) + '"][data-of="label"]'); if (n) n.focus(); return;
  }
  if (d.odel !== undefined) {
    const [i, j] = d.odel.split(':').map(Number), o = ownOpts(P[i]);
    if (o.length <= 1) { toast('Mantenha pelo menos 1 opção.'); return; }
    const snap = JSON.stringify(S); o.splice(j, 1); render(); changed(); toast('Opção removida', 'Desfazer', () => load(snap)); return;
  }
  if (d.oreset !== undefined) {
    const snap = JSON.stringify(S); delete P[+d.oreset].options; render(); changed(); toast('Opções padrão da loja restauradas', 'Desfazer', () => load(snap)); return;
  }
  if (d.pct !== undefined) { const f = 1 + (parseFloat(el('#pct').value) || 0) / 100; const rd = v => Math.round(v * f * 100) / 100; P.forEach(p => { p.price = rd(p.price); if (Array.isArray(p.options)) p.options.forEach(o => { if (!noPrice(o)) o.price = rd(+o.price); }); }); render(); changed(); toast('Preços ajustados', 'Desfazer', () => go(-1)); flush(); return; }
});
el('#undo').onclick = () => go(-1); el('#redo').onclick = () => go(1);
el('#reset').onclick = () => { const snap = JSON.stringify(S); load(DEF); toast('Site original restaurado', 'Desfazer', () => load(snap)); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !ov.hidden) closeOv();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); el('#tgl').click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); go(1); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); go(e.shiftKey ? 1 : -1); }
});

/* ---------- visualizar e baixar ---------- */
const ov = el('#ov'), ovf = el('#ovf');
el('#prev').onclick = () => { ovf.srcdoc = build(); ov.hidden = false; };
const closeOv = () => { ov.hidden = true; ovf.srcdoc = ''; el('#prev').focus(); };
el('#ovX').onclick = closeOv;
document.querySelectorAll('[data-ow]').forEach(b => b.onclick = () => ovf.style.width = b.dataset.ow);
el('#ovTab').onclick = () => { try { window.open(URL.createObjectURL(new Blob([build()], { type: 'text/html' })), '_blank'); } catch (e) {} };
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
el('#dl').onclick = async () => {
  const { html, files } = build(true), slug = (S.name || 'site').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'site';
  if (!window.JSZip) { toast('Sem internet para gerar o ZIP: baixando só o index.html.'); save(new Blob([html], { type: 'text/html' }), 'index.html'); return; }
  const z = new JSZip(); z.file('index.html', html); files.forEach(f => z.file(f.path, f.b64, { base64: true }));
  z.file('LEIA-ME.txt', 'Site gerado pelo Site Studio.\nAbra o index.html no navegador ou envie a pasta para sua hospedagem.\n');
  save(await z.generateAsync({ type: 'blob' }), 'site-' + slug + '.zip'); toast('✓ ZIP gerado');
};

/* ---------- prévia de desktop: renderiza na largura real e reduz para caber ---------- */
const DEVW = { '100%': 1280, '768px': 768, '390px': 390 };
let dev = '100%', zoom = 'fit';
function layout() {
  const vp = el('#vp'), narrow = window.matchMedia('(max-width:860px)').matches, pad = narrow ? 16 : 28, avW = vp.clientWidth - pad, avH = vp.clientHeight - pad;
  if (avW <= 0 || avH <= 0) return;
  const W = narrow ? Math.max(avW, 320) : DEVW[dev];
  const s = narrow ? Math.min(1, avW / W) : (zoom === 'fit' ? Math.min(1, avW / W) : +zoom), f = el('#frame'), w = el('#wrap');
  f.style.width = W + 'px'; f.style.height = (avH / s) + 'px'; f.style.transform = 'scale(' + s + ')';
  f.classList.toggle('phone', !narrow && dev === '390px'); el('#chrome').style.display = narrow || dev === '390px' ? 'none' : '';
  w.style.width = (W * s) + 'px'; w.style.height = avH + 'px';
  el('#zoom').options[0].textContent = 'Ajustar · ' + Math.round(s * 100) + '%';
}
window.addEventListener('resize', layout); if (window.ResizeObserver) new ResizeObserver(layout).observe(el('#vp'));
el('#zoom').onchange = e => { zoom = e.target.value; layout(); };
el('#tgl').onclick = () => { const on = document.body.classList.toggle('nopanel'); el('#tgl').setAttribute('aria-pressed', on); };
/* leva a prévia até a seção que está sendo editada */
const JUMP = { presets: '#inicio', look: '#inicio', content: '#inicio', contact: '#contato', items: '#produtos' };
function jump(sel) { try { const n = el('#pv').contentDocument.querySelector(sel); if (n) { lastY = 0; n.scrollIntoView({ behavior: 'smooth', block: 'start' }); } } catch (x) {} }
el('#panel').addEventListener('focusin', e => { const k = (e.target.dataset && e.target.dataset.k) || '';
  if (/^about/.test(k)) jump('#sobre'); else if (/^(address|phone|wa|waMsg)$/.test(k)) jump('#contato'); else if (/^(name|tagline|announcement|heroImg)$/.test(k)) jump('#inicio'); });

render(); preview(); layout();
if (restored) toast('Rascunho anterior restaurado', 'Começar do zero', () => load(DEF));
</script>
</body>
